<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap Coin & Quant Multiplier Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            text-align: center;
            background-color: #2b2b2b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            width: 320px;
        }
        .coin-btn {
            background-color: #f1c40f;
            color: #1a1a1a;
            border: none;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px #d4ac0d;
            transition: all 0.1s ease;
            margin: 20px 0;
        }
        .coin-btn:active {
            box-shadow: 0 2px #d4ac0d;
            transform: translateY(4px);
        }
        .stats {
            font-size: 18px;
            margin-bottom: 15px;
        }
        .shop {
            margin-top: 20px;
            border-top: 1px solid #444;
            padding-top: 15px;
        }
        .shop-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            margin-top: 10px;
        }
        .shop-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h2>Tap Coin Clicker</h2>
    
    <div class="stats">
        <div>Coins: <span id="coinCount">0</span> 🪙</div>
        <div>Quant Multiplier: <span id="quantMult">1.0</span>x</div>
    </div>

    <button class="coin-btn" onclick="tapCoin()">TAP COIN!</button>

    <div class="shop">
        <h3>Shop</h3>
        <button id="upgradeBtn" class="shop-btn" onclick="buyQuantUpgrade()">
            Upgrade Quant Multiplier (+0.5x)<br>
            Cost: <span id="upgradeCost">10</span> Coins
        </button>
    </div>
</div>

<script>
    let coins = 0;
    let quantMultiplier = 1.0;
    let upgradeCost = 10;

    function tapCoin() {
        coins += 1 * quantMultiplier;
        updateUI();
    }

    function buyQuantUpgrade() {
        if (coins >= upgradeCost) {
            coins -= upgradeCost;
            quantMultiplier += 0.5;
            upgradeCost = Math.floor(upgradeCost * 1.8);
            updateUI();
        }
    }

    function updateUI() {
        document.getElementById('coinCount').innerText = Math.floor(coins);
        document.getElementById('quantMult').innerText = quantMultiplier.toFixed(1);
        document.getElementById('upgradeCost').innerText = upgradeCost;

        const upgradeBtn = document.getElementById('upgradeBtn');
        upgradeBtn.disabled = coins < upgradeCost;
    }
</script>

</body>
</html>
